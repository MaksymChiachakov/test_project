name: BasicFit Auto-Apply x2

on:
  schedule:
    - cron: '*/10 * * * *'   # Toutes les 10 minutes
  workflow_dispatch:           # Permet aussi un lancement manuel

jobs:
  auto-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # Assez long pour plusieurs candidatures Playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Cache Playwright (comme avant) ---
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      # --- RESTAURATION DE L'ÉTAT (offres déjà postulées) ---
      - name: Restore applied jobs state
        uses: actions/cache/restore@v4
        with:
          path: applied_jobs.json
          key: applied-jobs-v1
          restore-keys: |
            applied-jobs-v1

      # --- LE CŒUR : détection + candidature ---
      - name: Run Auto-Apply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_and_apply.py

      # --- SAUVEGARDE DE L'ÉTAT (même en cas d'échec partiel) ---
      - name: Save applied jobs state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: applied_jobs.json
          key: applied-jobs-v1-${{ github.run_id }}